name: Bug Report
description: Report an issue, defect, or unexpected behavior.
title: "[BUG]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to help us reproduce and fix the bug.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start application with '...'
        2. Disconnect RDP session
        3. Check status.json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: Paste relevant logs from `data/logs/app.log` or console output.
    validations:
      required: false
